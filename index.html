<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수업일지 - 몽뜰유학미술학원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#f5f3ef;min-height:100vh;color:#1a1a1a}
:root{--orange:#E8651A;--lt-org:#FDE9D9;--pale:#FFF4EE;--gray:#595959;--line:#e0dcd6;--cream:#fdfcfa}
.header{background:#fff;border-bottom:1px solid var(--line);padding:0 24px;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:100}
.logo{font-size:18px;font-weight:600;color:var(--orange)}
.header-sub{font-size:13px;color:#999}
.status{margin-left:auto;font-size:12px;color:#bbb;display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:#bbb}
.dot.ok{background:#4CAF50}.dot.err{background:#e53935}
.container{max-width:980px;margin:0 auto;padding:24px 16px}
.filter-bar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.filter-bar label{font-size:13px;color:var(--gray);font-weight:500;white-space:nowrap}
.filter-bar select{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-family:inherit;font-size:14px;background:#fff;cursor:pointer;outline:none}
.filter-bar select:focus{border-color:var(--orange)}
.sep{width:1px;height:24px;background:var(--line)}
.time-btns{display:flex;gap:4px}
.tbtn{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--gray);cursor:pointer;transition:all .15s}
.tbtn.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.tab-bar{display:flex;gap:4px;margin-bottom:16px}
.tab{padding:8px 18px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--gray);transition:all .15s}
.tab.active{background:var(--orange);color:#fff;border-color:var(--orange)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.card-header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.card-header h2{font-size:15px;font-weight:600}
.save-btn{background:var(--orange);color:#fff;border:none;border-radius:8px;padding:7px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s}
.save-btn:hover{opacity:.85}.save-btn:disabled{opacity:.5;cursor:not-allowed}.save-btn.saved{background:#4CAF50}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
thead tr{background:#faf9f7}
th{padding:10px 12px;text-align:left;font-weight:600;font-size:12px;color:var(--gray);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:0;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#faf9f7}
td input[type=text],td textarea,td select{width:100%;border:none;background:transparent;font-family:inherit;font-size:14px;color:#1a1a1a;padding:10px 12px;outline:none;resize:none}
td textarea{min-height:56px;line-height:1.5}
td input[type=text]:focus,td textarea:focus,td select:focus{background:var(--pale)}
.att--{color:#bbb}.att-출석{color:#2e7d32;font-weight:500}.att-결석{color:#c62828;font-weight:500}.att-조퇴{color:#e65100;font-weight:500}.att-지각{color:#1565c0;font-weight:500}
.col-name{width:130px;min-width:110px}.col-att{width:85px}.col-content{min-width:200px}.col-memo{min-width:160px}.col-next{min-width:140px}
.ac-wrap{position:relative;width:100%}
.ac-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;z-index:200;max-height:160px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.ac-item{padding:8px 12px;font-size:13px;cursor:pointer}
.ac-item:hover,.ac-item.active{background:var(--pale);color:var(--orange)}
.log-section{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.log-header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.log-header h2{font-size:15px;font-weight:600}
.log-filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.log-filter select,.log-filter input{border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;font-family:inherit;outline:none}
.log-filter input{width:110px}
.log-filter input:focus,.log-filter select:focus{border-color:var(--orange)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-이소연{background:#fff3e0;color:#e65100}.badge-윤선하{background:#e8f5e9;color:#2e7d32}.badge-권서진{background:#e3f2fd;color:#1565c0}
.badge-time{background:#f3f0ff;color:#5b3fa6;font-size:11px;padding:2px 7px;border-radius:10px}
.del-btn{background:none;border:none;color:#ccc;cursor:pointer;font-size:16px;padding:8px 12px}
.del-btn:hover{color:#e53935}
.export-btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;color:var(--gray)}
.export-btn:hover{border-color:var(--orange);color:var(--orange)}
.loading{display:none;position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:999;align-items:center;justify-content:center;font-size:14px;color:var(--gray)}
.loading.show{display:flex}
.spinner{width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999}
.toast.show{opacity:1}
.hint{padding:10px 20px;background:#faf9f7;border-top:1px solid var(--line);font-size:12px;color:#aaa}
</style>
</head>
<body>

<div class="loading" id="loading"><div class="spinner"></div><span id="loading-msg">불러오는 중...</span></div>
<div class="toast" id="toast"></div>

<div class="header">
  <span class="logo">🎨 수업일지</span>
  <span class="header-sub">몽뜰유학미술학원</span>
  <div class="status">
    <div class="dot" id="sdot"></div>
    <span id="stxt">연결 중</span>
  </div>
</div>

<div class="container">
  <div class="filter-bar">
    <label>날짜</label>
    <select id="sel-date"></select>
    <div class="sep"></div>
    <label>선생님</label>
    <select id="sel-teacher">
      <option value="">선택</option>
      <option>이소연</option><option>윤선하</option><option>권서진</option>
    </select>
    <div class="sep"></div>
    <label>타임</label>
    <div class="time-btns">
      <div class="tbtn on" onclick="setTime('13-17')" id="tbtn1">13–17시</div>
      <div class="tbtn" onclick="setTime('18-22')" id="tbtn2">18–22시</div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab active" onclick="switchTab('write')">오늘 기록</div>
    <div class="tab" onclick="switchTab('log')">전체 기록</div>
  </div>

  <div id="tab-write">
    <div class="card">
      <div class="card-header">
        <h2 id="write-title">학생별 수업 메모</h2>
        <button class="save-btn" id="save-btn" onclick="saveRecords()">저장</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th class="col-name">학생 이름</th>
            <th class="col-att">출결</th>
            <th class="col-content">수업 내용 / 진행상황</th>
            <th class="col-memo">메모 / 특이사항</th>
            <th class="col-next">다음 수업 포인트</th>
          </tr></thead>
          <tbody id="write-tbody"></tbody>
        </table>
      </div>
      <div class="hint">💡 저장은 날짜 + 선생님 + 타임 단위로 저장돼요. 낮타임 저장해도 밤타임 기록은 따로 유지됩니다.</div>
    </div>
  </div>

  <div id="tab-log" style="display:none">
    <div class="log-section">
      <div class="log-header">
        <h2>전체 기록</h2>
        <div class="log-filter">
          <select id="lf-date" onchange="renderLog()"><option value="">전체 날짜</option></select>
          <select id="lf-teacher" onchange="renderLog()">
            <option value="">전체 선생님</option>
            <option>이소연</option><option>윤선하</option><option>권서진</option>
          </select>
          <select id="lf-time" onchange="renderLog()">
            <option value="">전체 타임</option>
            <option value="13-17">13–17시</option>
            <option value="18-22">18–22시</option>
          </select>
          <input type="text" id="lf-name" placeholder="학생 이름 검색" oninput="renderLog()">
          <button class="export-btn" onclick="exportCSV()">CSV 내보내기</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>날짜</th><th>선생님 / 타임</th>
            <th class="col-name">학생</th><th class="col-att">출결</th>
            <th class="col-content">수업 내용</th><th class="col-memo">메모</th>
            <th class="col-next">다음 포인트</th><th></th>
          </tr></thead>
          <tbody id="log-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbytA-2tDHPVXIeq6C05m-K78Jk6mJBMgy91e308WYO1Pa7SHcktYrNWLbPfvMJa4JgQHA/exec';
const ATT=['−','출석','결석','조퇴','지각'];
const ROWS=15;
const DEFAULT_NAMES=['복서정','신예인','엄하현','이동준','정현준','이윤지','서희원','박찬수','홍지유','전병민','고서연','김가온','박지연'];

let allRecords=[];
let knownNames=JSON.parse(localStorage.getItem('artlog_names')||'[]');
DEFAULT_NAMES.forEach(n=>{if(!knownNames.includes(n))knownNames.push(n)});
localStorage.setItem('artlog_names',JSON.stringify(knownNames));

let curTime='13-17';

function showLoad(m='불러오는 중...'){document.getElementById('loading-msg').textContent=m;document.getElementById('loading').classList.add('show')}
function hideLoad(){document.getElementById('loading').classList.remove('show')}
function toast(m,d=2200){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),d)}
function setStatus(ok,m){document.getElementById('sdot').className='dot '+(ok?'ok':'err');document.getElementById('stxt').textContent=m}

async function loadAll(){
  showLoad('데이터 불러오는 중...');
  try{
    const res=await fetch(API+'?action=getAll');
    const data=await res.json();
    allRecords=(Array.isArray(data)?data:[]).map(r=>({...r,date:toKST(r.date)}));
    const names=new Set(knownNames);
    allRecords.forEach(r=>{if(r.name)names.add(r.name)});
    knownNames=[...names];
    localStorage.setItem('artlog_names',JSON.stringify(knownNames));
    setStatus(true,'구글 시트 연결됨');
  }catch(e){setStatus(false,'연결 실패');toast('서버 연결 실패. 잠시 후 다시 시도해주세요.')}
  finally{hideLoad()}
}

function toKST(val){
  if(!val) return '';
  const s=String(val);
  if(s.includes('T')||s.includes('Z')){
    const kst=new Date(new Date(s).getTime()+9*60*60*1000);
    return kst.getUTCFullYear()+'-'+String(kst.getUTCMonth()+1).padStart(2,'0')+'-'+String(kst.getUTCDate()).padStart(2,'0');
  }
  return s.slice(0,10);
}

function genDates(){
  const dates=[];const today=new Date();const end=new Date(today.getFullYear(),11,31);
  const days=['일','월','화','수','목','금','토'];
  for(let d=new Date(today);d<=end;d.setDate(d.getDate()+1)){
    const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
    dates.push({value:`${y}-${m}-${day}`,label:`${y}.${m}.${day} (${days[d.getDay()]})`});
  }
  return dates;
}

function initDateSelect(){
  const sel=document.getElementById('sel-date');
  genDates().forEach(d=>{const o=document.createElement('option');o.value=d.value;o.textContent=d.label;sel.appendChild(o)});
}

function setTime(t){
  curTime=t;
  document.getElementById('tbtn1').className='tbtn'+(t==='13-17'?' on':'');
  document.getElementById('tbtn2').className='tbtn'+(t==='18-22'?' on':'');
  renderWriteTable();
}

function getKey(){
  return{date:document.getElementById('sel-date').value,teacher:document.getElementById('sel-teacher').value,time:curTime};
}

function renderWriteTable(){
  const{date,teacher,time}=getKey();
  const tbody=document.getElementById('write-tbody');
  const timeLabel=time==='13-17'?'13–17시':'18–22시';
  document.getElementById('write-title').textContent=
    (date&&teacher)?`${date} · ${teacher} 선생님 · ${timeLabel}`:'학생별 수업 메모';
  if(!date||!teacher){
    tbody.innerHTML=`<tr><td colspan="5" style="padding:32px;text-align:center;color:#bbb;font-size:14px">날짜와 선생님을 선택해 주세요</td></tr>`;
    return;
  }
  const existing=allRecords.filter(r=>r.date===date&&r.teacher===teacher&&r.time===time);
  const rows=[];
  for(let i=0;i<ROWS;i++) rows.push(existing[i]||{date,teacher,time,name:'',att:'-',content:'',memo:'',next:''});
  tbody.innerHTML=rows.map((r,i)=>`
    <tr>
      <td class="col-name"><div class="ac-wrap">
        <input type="text" value="${esc(r.name)}" data-i="${i}" data-f="name" placeholder="이름" autocomplete="off"
          oninput="showAC(this)" onkeydown="acKey(event,this)" onblur="setTimeout(()=>hideAC(this),150)">
        <div class="ac-list" style="display:none"></div>
      </div></td>
      <td class="col-att"><select data-i="${i}" data-f="att" class="att-sel" onchange="colorAtt()">
        ${ATT.map(o=>`<option value="${o}"${r.att===o?' selected':''}>${o}</option>`).join('')}
      </select></td>
      <td class="col-content"><textarea data-i="${i}" data-f="content" placeholder="수업 내용 및 진행상황">${esc(r.content)}</textarea></td>
      <td class="col-memo"><textarea data-i="${i}" data-f="memo" placeholder="메모 / 특이사항">${esc(r.memo)}</textarea></td>
      <td class="col-next"><textarea data-i="${i}" data-f="next" placeholder="다음 수업 포인트">${esc(r.next)}</textarea></td>
    </tr>`).join('');
  colorAtt();
}

function colorAtt(){
  document.querySelectorAll('.att-sel').forEach(s=>{s.className='att-sel att-'+s.value});
}

function showAC(input){
  const val=input.value.trim();
  const list=input.parentElement.querySelector('.ac-list');
  if(!val){list.style.display='none';return}
  const matches=knownNames.filter(n=>n.includes(val)&&n!==val);
  if(!matches.length){list.style.display='none';return}
  list.innerHTML=matches.map(n=>`<div class="ac-item" onmousedown="pickAC(this,'${esc(n)}')">${n}</div>`).join('');
  list.style.display='block';
}
function hideAC(input){const l=input.parentElement.querySelector('.ac-list');if(l)l.style.display='none'}
function pickAC(item,name){item.closest('.ac-wrap').querySelector('input').value=name;item.closest('.ac-list').style.display='none'}
function acKey(e,input){
  const list=input.parentElement.querySelector('.ac-list');
  const items=[...list.querySelectorAll('.ac-item')];
  const active=list.querySelector('.active');
  if(e.key==='ArrowDown'){e.preventDefault();const n=active?active.nextElementSibling:items[0];if(active)active.classList.remove('active');if(n)n.classList.add('active')}
  else if(e.key==='ArrowUp'){e.preventDefault();const p=active?active.previousElementSibling:items[items.length-1];if(active)active.classList.remove('active');if(p)p.classList.add('active')}
  else if(e.key==='Enter'&&active){e.preventDefault();pickAC(active,active.textContent)}
  else if(e.key==='Escape'){hideAC(input)}
}

async function saveRecords(){
  const{date,teacher,time}=getKey();
  if(!date||!teacher){toast('날짜와 선생님을 선택해 주세요');return}
  const btn=document.getElementById('save-btn');
  btn.disabled=true;btn.textContent='저장 중...';
  const rows=document.querySelectorAll('#write-tbody tr');
  const newRecs=[];
  rows.forEach(tr=>{
    const name=tr.querySelector('[data-f="name"]')?.value.trim()||'';
    const att=tr.querySelector('[data-f="att"]')?.value||'-';
    const content=tr.querySelector('[data-f="content"]')?.value.trim()||'';
    const memo=tr.querySelector('[data-f="memo"]')?.value.trim()||'';
    const next=tr.querySelector('[data-f="next"]')?.value.trim()||'';
    if(name||content||memo||next) newRecs.push({date,teacher,time,name,att,content,memo,next});
  });
  const names=new Set(knownNames);
  newRecs.forEach(r=>{if(r.name)names.add(r.name)});
  knownNames=[...names];
  localStorage.setItem('artlog_names',JSON.stringify(knownNames));
  try{
    await fetch(API,{method:'POST',body:JSON.stringify({action:'save',date,teacher,time,records:newRecs})});
    allRecords=allRecords.filter(r=>!(r.date===date&&r.teacher===teacher&&r.time===time));
    allRecords=[...allRecords,...newRecs];
    btn.textContent='저장됨 ✓';btn.classList.add('saved');
    toast('저장됐어요!');
    setTimeout(()=>{btn.textContent='저장';btn.classList.remove('saved');btn.disabled=false},1800);
  }catch(e){toast('저장 실패. 다시 시도해주세요.');btn.textContent='저장';btn.disabled=false}
}

function populateDateFilter(){
  const sel=document.getElementById('lf-date');
  const cur=sel.value;
  const dates=[...new Set(allRecords.map(r=>toKST(r.date)))].sort((a,b)=>b.localeCompare(a));
  sel.innerHTML='<option value="">전체 날짜</option>'+dates.map(d=>`<option value="${d}"${d===cur?' selected':''}>${d}</option>`).join('');
}

function renderLog(){
  const fD=document.getElementById('lf-date').value;
  const fT=document.getElementById('lf-teacher').value;
  const fTm=document.getElementById('lf-time').value;
  const fN=document.getElementById('lf-name').value.trim();
  const tbody=document.getElementById('log-tbody');
  let filtered=[...allRecords];
  if(fD) filtered=filtered.filter(r=>toKST(r.date)===fD);
  if(fT) filtered=filtered.filter(r=>r.teacher===fT);
  if(fTm) filtered=filtered.filter(r=>r.time===fTm);
  if(fN) filtered=filtered.filter(r=>r.name&&r.name.includes(fN));
  filtered.sort((a,b)=>b.date.localeCompare(a.date)||a.time.localeCompare(b.time));
  if(!filtered.length){tbody.innerHTML=`<tr><td colspan="9" style="padding:40px;text-align:center;color:#bbb;font-size:14px">기록이 없어요</td></tr>`;return}
  tbody.innerHTML=filtered.map(r=>`
    <tr>
      <td style="padding:10px 12px;white-space:nowrap;color:#666;font-size:12px">${toKST(r.date)}</td>
      <td style="padding:10px 12px;white-space:nowrap"><span class="badge badge-${r.teacher}">${r.teacher}</span> <span class="badge-time">${r.time==='13-17'?'13–17시':'18–22시'}</span></td>
      <td style="padding:10px 12px;font-weight:500">${esc(r.name)||'—'}</td>
      <td style="padding:10px 12px"><span class="att-${r.att}">${r.att}</span></td>
      <td style="padding:10px 12px;font-size:13px;max-width:200px">${esc(r.content)||'—'}</td>
      <td style="padding:10px 12px;font-size:13px;max-width:160px">${esc(r.memo)||'—'}</td>
      <td style="padding:10px 12px;font-size:13px;max-width:140px">${esc(r.next)||'—'}</td>
      <td><button class="del-btn" onclick="deleteRecord('${r.date}','${r.teacher}','${r.time}','${esc(r.name)}')">×</button></td>
    </tr>`).join('');
}

async function deleteRecord(date,teacher,time,name){
  if(!confirm('이 기록을 삭제할까요?'))return;
  showLoad('삭제 중...');
  try{
    await fetch(API,{method:'POST',body:JSON.stringify({action:'delete',date,teacher,time,name})});
    allRecords=allRecords.filter(r=>!(r.date===date&&r.teacher===teacher&&r.time===time&&r.name===name));
    toast('삭제됐어요');renderLog();
  }catch(e){toast('삭제 실패')}
  finally{hideLoad()}
}

function exportCSV(){
  const header=['날짜','선생님','타임','학생','출결','수업내용','메모','다음포인트'];
  const rows=allRecords.map(r=>[r.date,r.teacher,r.time,r.name,r.att,r.content,r.memo,r.next].map(v=>`"${(v||'').replace(/"/g,'""')}"`).join(','));
  const csv='\uFEFF'+[header.join(','),...rows].join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`수업일지_${new Date().toISOString().slice(0,10)}.csv`;a.click();
}

function switchTab(tab){
  document.getElementById('tab-write').style.display=tab==='write'?'':'none';
  document.getElementById('tab-log').style.display=tab==='log'?'':'none';
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',(i===0&&tab==='write')||(i===1&&tab==='log')));
  if(tab==='log') loadAll().then(()=>{populateDateFilter();renderLog()});
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

initDateSelect();
document.getElementById('sel-date').addEventListener('change',()=>{const{date,teacher}=getKey();if(date&&teacher)loadAll().then(renderWriteTable);else renderWriteTable()});
document.getElementById('sel-teacher').addEventListener('change',()=>{const{date,teacher}=getKey();if(date&&teacher)loadAll().then(renderWriteTable);else renderWriteTable()});
renderWriteTable();
loadAll();
</script>
